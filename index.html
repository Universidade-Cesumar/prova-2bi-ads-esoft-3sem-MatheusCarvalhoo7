<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Controle de Almoxarifado</title>

    <link rel="stylesheet" href="style.css">
</head>
<body>

    <main>
        <h1>Controle de Almoxarifado</h1>

        <p>
            Sistema para cadastro e consulta de materiais.
        </p>

        <section>

        <h2>Cadastrar Material</h2>

    <div>
        <label for="input-nome">
            Nome do Material
        </label>

        <input
            type="text"
            id="input-nome"
            placeholder="Digite o nome do material">
    </div>

    <div>
        <label for="input-quantidade">
            Quantidade
        </label>

        <input
            type="number"
            id="input-quantidade"
            placeholder="Digite a quantidade">
    </div>

    <button id="btn-cadastrar">
        Cadastrar
    </button>

    </section>

    <section>

    <h2>Materiais Cadastrados</h2>

    <div>
        <label for="input-retirada">
            Quantidade para Retirada
        </label>

        <input
            type="number"
            id="input-retirada"
            placeholder="Digite a quantidade para retirar">
    </div>

    <table>

        <thead>
            <tr>
                <th>Nome</th>
                <th>Quantidade</th>
            </tr>
        </thead>

        <tbody id="lista-materiais">

        </tbody>

    </table>

    </section>
    </main>

    <script src="main.js"></script>
</body>
</html>
